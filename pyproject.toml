[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "enterprise-rag-pareto-benchmark"
version = "0.1.0"
description = "Reproducible Enterprise RAG Pareto benchmark for retrieval quality, latency, cost, and hallucination risk."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [{name = "Paper 5 authors"}]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0", "pyyaml>=6.0", "matplotlib>=3.8", "pandas>=2.0"]
neural = ["sentence-transformers>=2.7"]

[project.scripts]
rag-pareto = "rag_pareto.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
