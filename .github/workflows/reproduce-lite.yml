name: reproduce-lite

on:
  push:
  pull_request:

jobs:
  reproduce-lite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -e .
      - run: PYTHONPATH=src python -m unittest discover -s tests
      - run: PYTHONPATH=src python scripts/run_main_benchmark.py
      - run: test -f results/default/tables/summary_metrics.csv
      - run: test -f results/default/figures/pareto_frontier.pdf
      - run: test -f results/default/run_metadata.json

